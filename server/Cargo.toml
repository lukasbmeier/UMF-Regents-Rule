[package]
name = "umf_module"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib for the WASM module; rlib so tests/golden.rs can link sim

[dependencies]
# PINNED to the exact patch (REVIEW 0.23.1 B5): row-level security rides on the "unstable" feature
# (#[client_visibility_filter]), so a bump could silently stop enforcing it and leak every player's
# `challenge` rows. Change this only together with the server (`spacetime version`), then run
# tests/integration_test.sh: its row-level security section reads as an anonymous identity and
# fails if the filters stopped working (DECISIONS #32).
spacetimedb = { version = "=2.10.1", features = ["unstable"] }
# sim.rs derives SpacetimeType from here, not from `spacetimedb`, so the golden harness links natively.
spacetimedb-lib = "=2.10.1"
log = "0.4"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
